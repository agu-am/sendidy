services:
  - type: web
    name: telegram-mirror-bot
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SEND_DELAY_MS
        value: 80
      - key: ADMIN_CACHE_TTL
        value: 300
